name: Test e pubblicazione su GitHub Pages

# A ogni push su main: prima girano i test sui dati della gara reale, e SOLO
# se passano tutti il sito viene pubblicato. Se un test fallisce il sito resta
# alla versione precedente — quella che funzionava.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permette di ripubblicare a mano dalla scheda Actions, senza fare un push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # 1. La rete di sicurezza. Verifica che la app sia ancora d'accordo con
  #    i risultati veri della 7a Stradolcetto.
  # ---------------------------------------------------------------------
  test:
    name: Test sui dati della gara reale
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          # Stessa versione usata in locale: se i test passano sul tuo computer
          # devono passare anche qui, e viceversa.
          node-version: '24'
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      # Servono entrambi: Chromium per i test da computer e per il profilo
      # Android, WebKit per il profilo iPhone. È il motore di Safari, quello
      # dove il tastierino di sistema non ha il tasto invio: i test del
      # telefono devono girare lì, non su un'imitazione.
      - name: Installa i browser per i test
        run: npx playwright install --with-deps chromium webkit

      - name: Esegui i test
        run: npm test

      # Se qualcosa fallisce, il rapporto resta scaricabile dalla pagina
      # della esecuzione: dice quale atleta e quale valore non torna.
      - name: Conserva il rapporto dei test
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapporto-test
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # 2. La pubblicazione. "needs: test" e' il blocco: senza test verdi
  #    questo lavoro non parte nemmeno.
  # ---------------------------------------------------------------------
  pubblica:
    name: Pubblica il sito
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il contenuto della radice
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pubblica
        id: deploy
        uses: actions/deploy-pages@v4
