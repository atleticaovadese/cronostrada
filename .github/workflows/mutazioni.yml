name: Prova della rete di sicurezza

# Rompe la app di proposito e verifica che i test se ne accorgano.
#
# Gira UNA VOLTA A SETTIMANA, non a ogni push: è una verifica della qualità
# dei test, non della modifica in arrivo, e richiede quattro esecuzioni
# complete della suite. A ogni push continuano a girare i test normali
# (workflow "Test e pubblicazione"), che sono quelli che bloccano il deploy.
#
# Si può lanciare anche a mano dalla scheda Actions, con "Run workflow".

on:
  schedule:
    # lunedì alle 05:00 UTC, quando non c'è nessuna gara in corso
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutazioni:
    name: Le rotture volontarie vengono intercettate?
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      # Le quattro rotture riguardano i calcoli e girano sul solo profilo
      # "computer": basta Chromium, WebKit qui non serve.
      - name: Installa il browser
        run: npx playwright install --with-deps chromium

      - name: Rompi la app e controlla che i test se ne accorgano
        run: npm run mutazioni

      # Lo script promette di rimettere tutto a posto: qui lo si verifica
      # dall'esterno, senza fidarsi della sua parola.
      - name: La app deve essere tornata identica
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Lo script ha lasciato dei file modificati:"
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "Nessun file modificato: index.html è tornato al byte."
