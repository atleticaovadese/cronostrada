<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Versione "maskable": Android ritaglia l'icona con forme diverse
       (cerchio, goccia, quadrato stondato). Tutto il disegno sta dentro il
       cerchio di sicurezza — diametro 80% della tela — e lo sfondo arriva
       fino ai bordi, così nessun ritaglio taglia via qualcosa. -->
  <rect width="512" height="512" fill="#12151a"/>

  <g transform="translate(256 256) scale(0.62) translate(-256 -280)" stroke-linecap="round">
    <rect x="230" y="44" width="52" height="46" rx="14" fill="#cfd6de"/>
    <rect x="243" y="84" width="26" height="34" fill="#cfd6de"/>
    <rect x="368" y="106" width="46" height="30" rx="12" fill="#9aa5b1" transform="rotate(42 391 121)"/>
    <rect x="98" y="106" width="46" height="30" rx="12" fill="#9aa5b1" transform="rotate(-42 121 121)"/>

    <circle cx="256" cy="292" r="168" fill="#0d1014"/>
    <circle cx="256" cy="292" r="152" fill="none" stroke="#f4f6f8" stroke-width="30"/>
    <circle cx="256" cy="292" r="126" fill="#1c2129"/>

    <g stroke="#e6eaee" stroke-width="16">
      <line x1="256" y1="184" x2="256" y2="214"/>
      <line x1="364" y1="292" x2="334" y2="292"/>
      <line x1="256" y1="400" x2="256" y2="370"/>
      <line x1="148" y1="292" x2="178" y2="292"/>
    </g>

    <line x1="256" y1="292" x2="330" y2="218" stroke="#43d68a" stroke-width="22"/>
    <circle cx="256" cy="292" r="18" fill="#43d68a"/>
  </g>
</svg>
